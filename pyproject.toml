[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-manager"
version = "0.1.0"
description = "A local-first Windows desktop app for custom hand gestures."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Pillow>=12.0,<13",
    "ai-edge-litert==2.3.0",
    "opencv-python>=4.10,<5",
    "pynput>=1.8,<2",
    "pystray>=0.19.5,<0.20",
    "scikit-learn==1.9.1",
    "ttkbootstrap>=2.0,<2.1",
]

[project.optional-dependencies]
build = [
    "pyinstaller==6.20.0",
]

[project.scripts]
gesture-manager = "gesture_manager.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gesture_manager = ["assets/*.png", "assets/*.ico"]

